<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Symbol Patcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f051a 0%, #1a0d2e 50%, #2d1a4e 100%);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #e0e7ff;
      padding: 60px 20px;
      min-height: 100vh;
    }
    .container { max-width: 750px; margin: 0 auto; }
    
    h1 { 
      margin-bottom: 1rem;
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      font-size: 13px;
      opacity: 0.6;
      margin-bottom: 3rem;
      letter-spacing: 0.5px;
    }
    
    .section {
      background: rgba(30, 20, 50, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(167, 139, 250, 0.15);
      border-radius: 16px;
      padding: 2.5rem;
      margin-bottom: 2rem;
      transition: all 0.3s ease;
    }
    
    .section:hover {
      border-color: rgba(167, 139, 250, 0.25);
      background: rgba(30, 20, 50, 0.8);
    }
    
    .label { 
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      opacity: 0.7;
      color: #a78bfa;
    }
    
    .dz {
      border: 2px dashed rgba(167, 139, 250, 0.4);
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(50, 30, 100, 0.2) 0%, rgba(100, 50, 150, 0.1) 100%);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .dz::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 50%, rgba(167, 139, 250, 0.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .dz:hover {
      border-color: #a78bfa;
      background: linear-gradient(135deg, rgba(100, 50, 150, 0.3) 0%, rgba(150, 100, 200, 0.1) 100%);
    }
    
    .dz:hover::before { opacity: 1; }
    
    .dz-text { 
      font-size: 16px;
      font-weight: 600;
      margin: 12px 0;
      color: #e0e7ff;
      position: relative;
      z-index: 1;
    }
    
    .dz-hint { 
      font-size: 13px;
      opacity: 0.5;
      position: relative;
      z-index: 1;
    }
    
    .dz.active {
      border-color: #86efac;
      background: linear-gradient(135deg, rgba(100, 200, 50, 0.2) 0%, rgba(150, 200, 100, 0.1) 100%);
    }
    
    input[type="file"] { display: none; }
    
    .status {
      margin-top: 1.5rem;
      padding: 1rem 1.25rem;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .status.ok {
      background: rgba(100, 200, 50, 0.1);
      color: #86efac;
      border: 1px solid rgba(100, 200, 50, 0.3);
    }
    
    .status.err {
      background: rgba(240, 82, 82, 0.1);
      color: #ff9999;
      border: 1px solid rgba(240, 82, 82, 0.3);
    }
    
    .file-list {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 400px;
      overflow-y: auto;
      padding: 0.5rem;
    }
    
    .file-list::-webkit-scrollbar {
      width: 6px;
    }
    
    .file-list::-webkit-scrollbar-track {
      background: rgba(167, 139, 250, 0.05);
      border-radius: 10px;
    }
    
    .file-list::-webkit-scrollbar-thumb {
      background: rgba(167, 139, 250, 0.2);
      border-radius: 10px;
    }
    
    .file-list::-webkit-scrollbar-thumb:hover {
      background: rgba(167, 139, 250, 0.4);
    }
    
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(80, 50, 150, 0.25);
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid rgba(167, 139, 250, 0.2);
      font-size: 13px;
      transition: all 0.2s ease;
      animation: slideIn 0.3s ease;
    }
    
    .file-item:hover {
      background: rgba(100, 70, 170, 0.35);
      border-color: rgba(167, 139, 250, 0.4);
      transform: translateX(4px);
    }
    
    .file-item-name {
      flex: 1;
      word-break: break-word;
      margin-right: 1rem;
      font-weight: 500;
      color: #a78bfa;
    }
    
    .file-item-remove {
      background: rgba(240, 82, 82, 0.15);
      color: #ff9999;
      border: 1px solid rgba(240, 82, 82, 0.3);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    
    .file-item-remove:hover {
      background: rgba(240, 82, 82, 0.35);
      border-color: rgba(240, 82, 82, 0.6);
      transform: scale(1.08);
    }
    
    .file-count {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(167, 139, 250, 0.1);
      border: 1px solid rgba(167, 139, 250, 0.2);
      border-radius: 8px;
      font-size: 12px;
      opacity: 0.8;
      text-align: center;
      font-weight: 600;
      color: #a78bfa;
    }
    
    .button-group {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    button {
      flex: 1;
      background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      position: relative;
      overflow: hidden;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }
    
    button:hover:not(:disabled)::before {
      left: 100%;
    }
    
    button:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(167, 139, 250, 0.4);
    }
    
    button:active:not(:disabled) {
      transform: translateY(-1px);
    }
    
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    
    .downloads {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      animation: slideIn 0.4s ease;
    }
    
    .result-header {
      padding: 1.5rem;
      background: linear-gradient(135deg, rgba(100, 200, 50, 0.15) 0%, rgba(150, 200, 100, 0.05) 100%);
      border: 1px solid rgba(100, 200, 50, 0.3);
      border-radius: 12px;
      color: #86efac;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 1.5rem;
      letter-spacing: 0.5px;
    }
    
    .download-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, rgba(134, 239, 172, 0.1) 0%, rgba(134, 239, 172, 0.05) 100%);
      color: #86efac;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.3s ease;
      border: 1px solid rgba(134, 239, 172, 0.25);
      position: relative;
      overflow: hidden;
    }
    
    .download-link::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(134, 239, 172, 0.1);
      transition: left 0.4s ease;
    }
    
    .download-link:hover {
      background: linear-gradient(135deg, rgba(134, 239, 172, 0.2) 0%, rgba(134, 239, 172, 0.1) 100%);
      border-color: rgba(134, 239, 172, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(134, 239, 172, 0.2);
    }
    
    .download-link:hover::before {
      left: 100%;
    }
    
    .download-filename {
      flex: 1;
      word-break: break-word;
    }
    
    .download-icon {
      margin-left: 1rem;
      flex-shrink: 0;
      font-size: 16px;
    }
    
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(30, 30, 35, 0.95);
      backdrop-filter: blur(10px);
      color: #e0e7ff;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      border: 1px solid rgba(167, 139, 250, 0.2);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    
    .toast.show { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ Symbol Patcher</h1>
    <div class="subtitle">Batch update obfuscated symbols across multiple files</div>

    <div class="section">
      <div class="label">① Frida-Map Reference</div>
      <div class="dz" id="dz1" onclick="document.getElementById('f1').click()">
        <div class="dz-text">📋 Drop Frida-Map.js</div>
        <div class="dz-hint">Contains the new symbol mappings</div>
      </div>
      <div id="s1"></div>
      <input type="file" id="f1" accept=".js">
    </div>

    <div class="section">
      <div class="label">② Source Files to Patch</div>
      <div class="dz" id="dz2" onclick="document.getElementById('f2').click()">
        <div class="dz-text">📁 Drop files here</div>
        <div class="dz-hint">Supports .ts, .js, .cpp, .h, .cs — select multiple</div>
      </div>
      <div id="s2"></div>
      <div class="file-list" id="fileList"></div>
      <input type="file" id="f2" multiple>
    </div>

    <div class="button-group">
      <button id="btn" disabled>🔄 Patch All Files</button>
    </div>
    <div id="result"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const toast = (msg) => {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show';
      setTimeout(() => el.className = 'toast', 3000);
    };

    let fridaMap = null;
    let sourceFiles = []; // Array of {file, text}

    // Setup drag & drop
    const setupDz = (dzId, inputId) => {
      const dz = document.getElementById(dzId);
      const inp = document.getElementById(inputId);
      dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('active'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('active'));
      dz.addEventListener('drop', e => { 
        e.preventDefault(); 
        dz.classList.remove('active'); 
        inp.files = e.dataTransfer.files; 
        inp.dispatchEvent(new Event('change')); 
      });
      inp.addEventListener('change', e => {
        if (inp === document.getElementById('f1')) handleFrida(inp.files[0]);
        else handleSources(inp.files);
      });
    };
    setupDz('dz1', 'f1');
    setupDz('dz2', 'f2');

    const handleFrida = async (file) => {
      if (!file) return;
      try {
        const text = await file.text();
        const map = {};
        for (const line of text.split('\n')) {
          if (!line.includes('findExportByName')) continue;
          const colonIdx = line.indexOf(':');
          if (colonIdx === -1) continue;
          const api = line.substring(0, colonIdx).trim();
          if (!/^\w+$/.test(api)) continue;
          const m = line.match(/"([^"]+)"/);
          if (m) map[api] = m[1];
        }
        if (Object.keys(map).length === 0) {
          document.getElementById('s1').className = 'status err';
          document.getElementById('s1').innerHTML = '✗ No symbols found';
          return;
        }
        fridaMap = map;
        document.getElementById('s1').className = 'status ok';
        document.getElementById('s1').innerHTML = '✓ Loaded <strong>' + Object.keys(map).length + ' symbols</strong>';
        toast('✓ Frida-Map loaded');
        checkReady();
      } catch (e) {
        document.getElementById('s1').className = 'status err';
        document.getElementById('s1').innerHTML = '✗ ' + e.message;
      }
    };

    const handleSources = async (files) => {
      if (!files.length) return;
      
      sourceFiles = [];
      const loadPromises = [];

      for (const file of files) {
        loadPromises.push(
          file.text().then(text => {
            sourceFiles.push({file, text});
          }).catch(e => {
            toast('Error loading ' + file.name);
          })
        );
      }

      await Promise.all(loadPromises);

      if (sourceFiles.length === 0) {
        document.getElementById('s2').className = 'status err';
        document.getElementById('s2').innerHTML = '✗ Error loading files';
        return;
      }

      document.getElementById('s2').className = 'status ok';
      document.getElementById('s2').innerHTML = '✓ Ready to patch <strong>' + sourceFiles.length + '</strong> file(s)';
      renderFileList();
      toast('✓ Loaded ' + sourceFiles.length + ' file(s)');
      checkReady();
    };

    const renderFileList = () => {
      const listEl = document.getElementById('fileList');
      listEl.innerHTML = '';
      
      if (sourceFiles.length === 0) return;

      sourceFiles.forEach((item, idx) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'file-item';
        
        const nameEl = document.createElement('div');
        nameEl.className = 'file-item-name';
        nameEl.textContent = item.file.name;
        
        const btnEl = document.createElement('button');
        btnEl.className = 'file-item-remove';
        btnEl.textContent = '✕ Remove';
        btnEl.type = 'button';
        btnEl.onclick = (e) => {
          e.preventDefault();
          sourceFiles.splice(idx, 1);
          renderFileList();
          checkReady();
        };
        
        itemEl.appendChild(nameEl);
        itemEl.appendChild(btnEl);
        listEl.appendChild(itemEl);
      });

      const countEl = document.createElement('div');
      countEl.className = 'file-count';
      countEl.textContent = sourceFiles.length + ' file(s) selected';
      listEl.appendChild(countEl);
    };

    const checkReady = () => {
      document.getElementById('btn').disabled = !(fridaMap && sourceFiles.length > 0);
    };

    document.getElementById('btn').addEventListener('click', () => {
      if (!fridaMap || sourceFiles.length === 0) return;

      // Extract old symbols from first source to build patch map
      const firstText = sourceFiles[0].text;
      const oldMap = {};
      for (const line of firstText.split('\n')) {
        if (!line.includes('findExportByName')) continue;
        const colonIdx = line.indexOf(':');
        if (colonIdx === -1) continue;
        const api = line.substring(0, colonIdx).trim();
        if (!/^\w+$/.test(api)) continue;
        const m = line.match(/"([^"]+)"/);
        if (m && !oldMap[api]) oldMap[api] = m[1];
      }

      // Build patch map: old_symbol → new_symbol
      const patchMap = {};
      for (const api in oldMap) {
        const oldSym = oldMap[api];
        const newSym = fridaMap[api];
        if (oldSym && newSym && oldSym !== newSym) {
          patchMap[oldSym] = newSym;
        }
      }

      if (Object.keys(patchMap).length === 0) {
        toast('⚠ No symbols to update');
        return;
      }

      // Apply patches to all files and generate downloads
      const resultEl = document.getElementById('result');
      resultEl.innerHTML = '';

      const headerEl = document.createElement('div');
      headerEl.className = 'result-header';
      headerEl.innerHTML = '✓ Patched ' + sourceFiles.length + ' file(s) — ' + Object.keys(patchMap).length + ' symbol(s) replaced';
      resultEl.appendChild(headerEl);

      const downloadsEl = document.createElement('div');
      downloadsEl.className = 'downloads';

      sourceFiles.forEach(item => {
        let patched = item.text;
        for (const [oldSym, newSym] of Object.entries(patchMap)) {
          patched = patched.replace(new RegExp(oldSym, 'g'), newSym);
        }

        const blob = new Blob([patched], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = item.file.name;
        link.className = 'download-link';
        link.innerHTML = '<span class="download-filename">⬇ ' + item.file.name + '</span><span class="download-icon">↓</span>';
        downloadsEl.appendChild(link);
      });

      resultEl.appendChild(downloadsEl);
      toast('✓ Ready to download');
    });
  </script>
</body>
</html>
